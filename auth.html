<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign in - Muhebrew Library</title>
<meta name="theme-color" content="#1b7f4b">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48' fill='none' stroke='%231b7f4b' stroke-width='4' stroke-linejoin='round'%3E%3Cpath d='M4 9h13c4 0 7 3 7 7v24c0-3-3-5-7-5H4z'/%3E%3Cpath d='M44 9H31c-4 0-7 3-7 7v24c0-3 3-5 7-5h13z'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/style.css">
<script>document.documentElement.setAttribute('data-theme',localStorage.getItem('ph_theme')||'light')</script>
</head>
<body class="auth">
<header class="site"><div class="wrap"><a class="logo" href="/"><svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" aria-hidden="true"><path d="M4 9h13c4 0 7 3 7 7v24c0-3-3-5-7-5H4z"/><path d="M44 9H31c-4 0-7 3-7 7v24c0-3 3-5 7-5h13z"/></svg><span>Muhebrew <b>Library</b></span></a><span class="spacer"></span></div></header>
<main class="wrap">
  <div class="auth-card">
    <h2 id="title">Welcome <span>back</span></h2>
    <div class="bar"></div>
    <p class="sub" id="sub">Download Malawi secondary school resources.</p>
    <form id="form">
      <div class="field" id="nameField" hidden><label for="name">Full name</label><div class="inp plain"><input id="name" placeholder="Enter your full name" autocomplete="name"></div></div>
      <div class="field"><label for="email">Email</label><div class="inp"><svg class="ico-l" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2.5"/><path d="M3.5 7l8.5 6 8.5-6"/></svg><input id="email" type="email" required placeholder="Enter your email" autocomplete="email" autocapitalize="none" autocorrect="off" spellcheck="false"></div></div>
      <div class="field"><label for="password">Password</label><div class="inp"><svg class="ico-l" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="9" rx="2.5"/><path d="M8 11V8a4 4 0 018 0v3"/><circle cx="12" cy="15.5" r="1"/></svg><input id="password" type="password" required placeholder="Enter your password" autocomplete="current-password" autocapitalize="none" autocorrect="off" spellcheck="false"><button type="button" class="eye" id="eye" aria-label="Show or hide password"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg></button></div></div>
      <div class="field" id="extraFields" hidden><label for="school">School</label><div class="inp plain"><input id="school" placeholder="Your school (optional)"></div></div>
      <div class="field" id="roleField" hidden><label for="role">I am a</label><div class="inp plain"><select id="role"><option value="student">Student</option><option value="teacher">Teacher (uploads are reviewed)</option></select></div></div>
      <div class="field" id="levelField" hidden><label for="level">Class level</label><div class="inp plain"><select id="level"><option value="">Select...</option><option>Form 1</option><option>Form 2</option><option>Form 3</option><option>Form 4</option></select></div></div>
      <button class="btn primary" id="submit">Sign in</button>
    </form>
    <p class="hint"><span id="hintText">No account?</span> <a href="#" id="toggle">Create one</a></p>
  </div>
</main>
<svg class="leaf" viewBox="0 0 200 220" aria-hidden="true"><path d="M100 210C100 140 90 90 40 40 110 50 150 100 100 210Z" fill="#4caf7d"/><path d="M110 210C115 150 140 100 190 70 190 140 160 180 110 210Z" fill="#2e9e63"/><path d="M100 210C95 160 60 130 10 125 20 175 55 200 100 210Z" fill="#6cc497"/></svg>

<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
</body>
</html>
